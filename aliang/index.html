<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>阿兩的單字火箭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 調皮、熱鬧、給 6 歲男孩的太空任務
   IDEA: 每週單字＝一顆星球，答對＝替火箭加油
   PICTURE: 大火箭＋星球地圖；題目卡就是畫面主角
   COLOUR/TYPE: 深太空藍底、火焰橘主色、星星黃點綴；Baloo 2＋Noto Sans TC
   LAYOUT: iPad 直橫皆可，按鈕至少 64px */
:root{--bg:#0d1640;--bg2:#17245e;--ink:#fff;--org:#ff7a1a;--yel:#ffd23f;--grn:#3ddc84;--red:#ff4d6d;--card:#fff;--cardInk:#1a1f3d}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 0%,#24358a 0%,var(--bg) 60%) fixed;color:var(--ink);font:18px/1.4 "Baloo 2","Noto Sans TC",system-ui,sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 20%,#fff8,transparent),radial-gradient(2px 2px at 80% 10%,#fff9,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff7,transparent),radial-gradient(2px 2px at 60% 40%,#fff6,transparent),radial-gradient(1.5px 1.5px at 90% 80%,#fff8,transparent),radial-gradient(2px 2px at 45% 90%,#fff5,transparent);z-index:-1}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.screen{display:none}.screen.on{display:block}
h1{font:800 clamp(34px,6vw,52px)/1.05 "Baloo 2","Noto Sans TC";margin:8px 0;text-wrap:balance}
h2{font:800 28px/1.1 "Noto Sans TC";margin:6px 0 12px}
.zh{font-family:"Noto Sans TC"}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:22px;min-height:64px}
button:focus-visible{outline:4px solid var(--yel);outline-offset:3px}
.big{background:var(--org);color:#fff;font:800 26px "Noto Sans TC";padding:12px 28px;box-shadow:0 6px 0 #b94d00}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b94d00}
.ghost{background:#ffffff1f;padding:8px 18px;font:800 18px "Noto Sans TC";min-height:52px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:#ffffff1f;border-radius:999px;padding:6px 16px;font-weight:800;white-space:nowrap}
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
.rocket{width:clamp(120px,22vw,190px);filter:drop-shadow(0 10px 24px #ff7a1a66)}
.rocket.fly{animation:fly 1.6s ease-in forwards}
@keyframes fly{to{transform:translateY(-120vh) rotate(4deg)}}
.flame{animation:flick .15s infinite alternate;transform-origin:50% 0}
@keyframes flick{to{transform:scaleY(1.25)}}
.fuel{height:18px;background:#ffffff22;border-radius:9px;overflow:hidden;margin-top:6px}
.fuel i{display:block;height:100%;background:linear-gradient(90deg,var(--org),var(--yel));border-radius:9px;transition:width .5s}
.planets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.planet{background:var(--bg2);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 #0a1030}
.planet .ball{width:70px;height:70px;border-radius:50%;box-shadow:inset -10px -10px 0 #0003,0 0 0 6px #ffffff14}
.planet b{font-size:22px}
.st{color:var(--yel);letter-spacing:2px;font-size:20px}
.st .off{color:#ffffff33}
.modes{display:grid;gap:14px;margin-top:10px}
.mode{display:flex;align-items:center;gap:16px;background:var(--bg2);padding:14px 18px;text-align:left;box-shadow:0 6px 0 #0a1030}
.mode .ic{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font:800 30px "Baloo 2";flex:none}
.mode b{display:block;font:800 24px "Noto Sans TC"}
.mode small{opacity:.8;font-size:16px}
.mode .st{margin-left:auto}
.prog{display:flex;gap:6px;margin:8px 0 14px}
.prog i{flex:1;height:12px;border-radius:6px;background:#ffffff22}
.prog i.ok{background:var(--grn)}.prog i.bad{background:var(--red)}.prog i.now{background:var(--yel)}
.ask{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 16px}
.spk{width:96px;height:96px;border-radius:50%;background:var(--org);box-shadow:0 6px 0 #b94d00;display:grid;place-items:center}
.spk svg{width:52px;height:52px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);color:var(--cardInk);border-radius:22px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;padding:8px;box-shadow:0 6px 0 #0a1030;position:relative}
.tile img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.tile .alt{font:800 26px "Noto Sans TC";text-align:center}
.tile.ok{outline:8px solid var(--grn)}.tile.bad{animation:shake .4s;opacity:.35}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.toast{position:fixed;left:50%;bottom:8vh;transform:translate(-50%,40px);opacity:0;background:#fff;color:var(--cardInk);border-radius:24px;padding:14px 28px;text-align:center;transition:.25s;box-shadow:0 10px 30px #0006;z-index:9;pointer-events:none;min-width:240px}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .en{font:800 38px "Baloo 2";line-height:1}.toast .z{font:800 22px "Noto Sans TC"}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:3/4;border-radius:18px;background:linear-gradient(135deg,var(--org),#ff3d7f);display:grid;place-items:center;font:800 34px "Baloo 2";box-shadow:0 5px 0 #0a1030;padding:6px;min-height:0}
.mc.up{background:#fff;color:var(--cardInk)}
.mc.done{background:#d8ffe8;color:var(--cardInk);opacity:.75}
.mc img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.mc .w{font:800 clamp(17px,3.2vw,26px)/1.05 "Baloo 2";word-break:break-word;text-align:center}
.boss{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.boss svg{width:84px;height:84px;flex:none}
.boss.hit svg{animation:shake .4s}
.hp{flex:1;height:22px;background:#ffffff22;border-radius:11px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--red);transition:width .4s}
.pic{background:#fff;border-radius:22px;height:min(38vh,300px);display:grid;place-items:center;padding:10px;margin-bottom:14px}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.pic .alt{color:var(--cardInk);font:800 34px "Noto Sans TC"}
.opts{display:grid;gap:12px}
.opt{background:var(--bg2);font:800 30px "Baloo 2";display:flex;align-items:center;gap:14px;padding:8px 20px;box-shadow:0 6px 0 #0a1030}
.opt .sp{width:48px;height:48px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;flex:none}
.opt.sel{background:#2d3f9c;outline:4px solid var(--yel)}
.opt.ok{background:var(--grn);color:#08331a}.opt.bad{animation:shake .4s;opacity:.4}
.fw{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font:800 clamp(34px,7vw,54px)/1 "Baloo 2"}
.lt{min-width:.62em;text-align:center}.lt.hole{color:var(--yel)}.lt.cur{border-bottom:5px solid var(--yel)}.lt.fil{color:var(--grn)}.gap{width:.5em}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;max-width:620px;margin:0 auto}
.key{background:#fff;color:var(--cardInk);font:800 36px "Baloo 2";box-shadow:0 6px 0 #0a1030;min-height:72px}
.key.used{opacity:.25}.key.bad{animation:shake .4s;background:#ffd6dd}
.quiz{margin-top:16px;background:linear-gradient(120deg,#3ddc84,#00a37a);border-radius:24px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;box-shadow:0 6px 0 #0a1030}
.quiz b{font-size:24px}.quiz select{font:800 20px 'Baloo 2';border-radius:12px;border:0;padding:6px 10px;min-height:44px}
.qbtn{display:flex;gap:10px;flex-wrap:wrap}.qbtn .big{font-size:22px;padding:8px 20px}.big.alt2{background:#4361ee;box-shadow:0 6px 0 #2a3aa8}
.tag{background:var(--yel);color:#3b2a00;border-radius:999px;padding:0 10px;font-size:14px;font-weight:800}
.lnw{text-align:center;font:800 clamp(48px,10vw,76px)/1.1 'Baloo 2';margin-top:6px;letter-spacing:2px}.lnz{text-align:center;font-size:26px;font-weight:800;margin-bottom:14px;opacity:.9}
.hint{opacity:.8;font-size:16px;text-align:center;margin:8px 0 0}
.result{text-align:center;padding-top:6vh}
.result .bigst{font-size:72px;color:var(--yel);letter-spacing:8px}
.result .bigst .off{color:#ffffff33}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.lvl{font:800 18px "Noto Sans TC";opacity:.9}
@media(max-width:600px){.hero{grid-template-columns:1fr}.rocket{margin:0 auto}.mem{grid-template-columns:repeat(3,1fr)}.opt{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">

<section id="home" class="screen on">
  <div class="hero">
    <div>
      <h1>阿兩的<br>單字火箭</h1>
      <div class="lvl" id="lvl"></div>
      <div class="fuel"><i id="fuel"></i></div>
      <p class="zh" style="margin:8px 0 0;opacity:.85">答對題目幫火箭加油，收集星星升級火箭！</p>
    </div>
    <svg class="rocket" id="rocketHome" viewBox="0 0 120 200" aria-hidden="true"></svg>
  </div>
  <div class="quiz"><div><b class="zh">本週小考</b> <select id="qwk" aria-label="本週小考週次"></select> <select id="qday" aria-label="星期幾的小考"></select><div class="zh" style="font-size:15px;opacity:.85">每週由爸媽改週次・星期會自動對到今天</div></div><div class="qbtn"><button class="big" id="goQuiz">小考特訓</button><button class="big alt2" id="goFinal">期末總複習 W9–16</button></div></div>
  <div class="top" style="margin-top:14px"><span class="pill" id="totalSt"></span><span class="pill">選一顆星球出發</span></div>
  <div class="planets" id="planets"></div>
</section>

<section id="week" class="screen">
  <div class="top"><button class="ghost" data-go="home">← 回地圖</button><span class="pill" id="wkSt"></span></div>
  <h2 id="wkTitle"></h2>
  <div class="modes" id="modes"></div>
</section>

<section id="play" class="screen">
  <div class="top"><button class="ghost" id="quit">← 離開</button><span class="pill" id="playName"></span></div>
  <div class="prog" id="prog"></div>
  <div id="stage"></div>
</section>

<section id="learn" class="screen">
  <div class="top"><button class="ghost" data-go="home">← 回地圖</button><span class="pill" id="lnName"></span></div>
  <div class="prog" id="lnProg"></div>
  <div class="pic" id="lnPic" style="height:min(36vh,300px)"></div>
  <div class="lnw" id="lnW"></div><div class="lnz zh" id="lnZ"></div>
  <div class="row"><button class="ghost" id="lnSay" style="min-height:64px;font-size:22px">🔊 再聽一次</button><button class="big" id="lnNext"></button></div>
</section>

<section id="done" class="screen">
  <div class="result">
    <svg class="rocket" id="rocketDone" viewBox="0 0 120 200" aria-hidden="true"></svg>
    <h1 id="doneT"></h1>
    <div class="bigst" id="doneSt"></div>
    <p class="zh" id="doneMsg"></p>
    <div class="row"><button class="big" id="again">再玩一次</button><button class="ghost" id="back2">換別的遊戲</button></div>
  </div>
</section>

</div>
<div class="toast" id="toast"><div class="en" id="tEn"></div><div class="z" id="tZh"></div></div>

const MODES=[
 {id:'listen',name:'聽聲音找圖',desc:'聽英文，點對的圖',c:'#ff7a1a',ic:'A'},
 {id:'memory',name:'翻牌配對',desc:'把圖和英文字配成一對',c:'#4cc9f0',ic:'B'},
 {id:'boss',name:'打敗怪獸',desc:'看圖，聽三個字選對的',c:'#ff4d6d',ic:'C'},
 {id:'fill',name:'補字母',desc:'跟小考一樣：把缺的字母補上',c:'#3ddc84',ic:'D'}];
const MAXW=MODES.length*3;
const KEY='aliang-rocket-v1';
let S={st:{},bonus:{},wr:{},wc:{},qwk:12};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.st)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const words=wk=>DATA[wk].map(([en,zh,img,d])=>({en,zh,img,d:d||''}));
const FINAL=WEEKS.filter(w=>w<=16);
const DAYN=['','一','二','三','四','五'];
let QDAY=(()=>{const g=new Date().getDay();return g>=1&&g<=5?g:1})();
const say=t=>{try{const sp=speechSynthesis;sp.cancel();const u=new SpeechSynthesisUtterance(t.replace(/-/g,' , '));u.lang='en-US';u.rate=.8;const v=sp.getVoices().find(v=>/en[-_]US/.test(v.lang)&&/Samantha|Google|Aaron|Nicky/.test(v.name))||sp.getVoices().find(v=>/en[-_]US/.test(v.lang));if(v)u.voice=v;sp.speak(u)}catch(e){}};
let AC=null;
const beep=(ok)=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[523,659,784]:[220,180]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'square';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.18,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.2);o.connect(g).connect(AC.destination);o.start(t+i*.09);o.stop(t+i*.09+.22)})}catch(e){}};
const imgTag=w=>w.img?`<img src="${IMG+esc(w.img)}" alt="" onerror="this.outerHTML='<div class=alt>${esc(w.zh).replace(/'/g,'')}</div>'">`:`<div class="alt">${esc(w.zh)}</div>`;
const starStr=n=>'★'.repeat(n)+`<span class="off">${'★'.repeat(3-n)}</span>`;
const total=()=>[...Object.values(S.st),...Object.values(S.bonus)].reduce((a,b)=>a+b,0);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const LV=[['紙箱火箭',0,'#c8a26b'],['小鐵火箭',20,'#9aa7b8'],['烈焰火箭',45,'#ff7a1a'],['閃電火箭',80,'#4cc9f0'],['黃金火箭',115,'#ffd23f']];
const level=()=>{const t=total();let i=0;LV.forEach((l,k)=>{if(t>=l[1])i=k});return i};
function drawRocket(el){const c=LV[level()][2];el.innerHTML=`<g class="flame"><path d="M45 160 Q60 200 75 160Z" fill="#ffd23f"/><path d="M50 160 Q60 185 70 160Z" fill="#ff7a1a"/></g><path d="M60 8 C88 36 92 90 86 160 L34 160 C28 90 32 36 60 8Z" fill="${c}"/><path d="M60 8 C72 22 78 36 80 52 L40 52 C42 36 48 22 60 8Z" fill="#ff4d6d"/><circle cx="60" cy="88" r="17" fill="#17245e" stroke="#fff" stroke-width="6"/><path d="M34 120 L12 160 L36 152Z M86 120 L108 160 L84 152Z" fill="#ff4d6d"/><path d="M40 60 L44 150" stroke="#fff6" stroke-width="5" stroke-linecap="round"/>`}

let cur={wk:null,mode:null};
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0);if(id==='home')home();if(id==='week')week(cur.wk)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});

function home(){
  const t=total(),li=level(),nx=LV[li+1];
  $('lvl').textContent=`${LV[li][0]}`+(nx?`｜再 ${nx[1]-t} 顆星升級成${nx[0]}`:'｜最高等級！');
  $('fuel').style.width=(nx?((t-LV[li][1])/(nx[1]-LV[li][1])*100):100)+'%';
  $('totalSt').textContent=`★ ${t}`;
  drawRocket($('rocketHome'));$('qwk').value=S.qwk;$('qday').value=QDAY;$('goQuiz').textContent=`今天的小考（${words(S.qwk).filter(w=>w.d.includes(QDAY)).length} 個字）`;
  $('planets').innerHTML=WEEKS.map((w,i)=>{const s=MODES.reduce((a,m)=>a+(S.st[w+m.id]||0),0);
    return `<button class="planet" data-wk="${w}"><span class="ball" style="background:${PCOL[i%10]}"></span><b>Week ${w}</b>${w===S.qwk?'<span class="tag zh">本週小考</span>':''}<span class="zh" style="font-size:15px">${PNAME[i%10]}</span><span class="st" style="font-size:16px">★ ${s}/${MAXW}</span></button>`}).join('');
}
$('planets').addEventListener('click',e=>{const b=e.target.closest('[data-wk]');if(!b)return;cur.wk=+b.dataset.wk;go('week')});

function week(wk){
  const i=WEEKS.indexOf(wk);
  $('wkTitle').innerHTML=`Week ${wk}・${PNAME[i%10]}<br><span style="font-size:18px;opacity:.8">${DATA[wk].length} 個單字</span>`;
  $('wkSt').textContent='★ '+MODES.reduce((a,m)=>a+(S.st[wk+m.id]||0),0)+'/'+MAXW;
  $('modes').innerHTML=MODES.map(m=>`<button class="mode" data-m="${m.id}"><span class="ic" style="background:${m.c}">${m.ic}</span><span><b>${m.name}</b><small class="zh">${m.desc}</small></span><span class="st">${starStr(S.st[wk+m.id]||0)}</span></button>`).join('');
}
$('modes').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)start(b.dataset.m)});

let G=null;
const toast=(w,ms=1300)=>{$('tEn').textContent=w.en;$('tZh').textContent=w.zh;$('toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('on'),ms)};
const fillOK=w=>{const n=w.en.replace(/[^a-z]/gi,'').length;return n>=3&&n<=12};
const weak=w=>(S.wr[w.en]||0)*2-(S.wc[w.en]||0)+Math.random()*1.5;
function learnFirst(){cur.special='quiz';const ws=words(S.qwk).filter(w=>w.d.includes(QDAY));L={ws,i:0};$('lnName').textContent=`先複習：W${S.qwk} 星期${DAYN[QDAY]}`;go('learn');showLearn()}
let L=null;
function showLearn(){const w=L.ws[L.i];$('lnProg').innerHTML=L.ws.map((_,k)=>`<i class="${k<L.i?'ok':k===L.i?'now':''}"></i>`).join('');$('lnPic').innerHTML=imgTag(w);$('lnW').textContent=w.en;$('lnZ').textContent=w.zh;$('lnNext').textContent=L.i<L.ws.length-1?'下一個 →':'記住了，開始小考！';setTimeout(()=>say(w.en),250)}
$('lnSay').onclick=()=>say(L.ws[L.i].en);
$('lnNext').onclick=()=>{if(L.i<L.ws.length-1){L.i++;showLearn()}else startSpecial('quiz')};
function startSpecial(sp){cur.special=sp;const src=sp==='quiz'?words(S.qwk).filter(w=>w.d.includes(QDAY)):FINAL.flatMap(words);
  const ws=sp==='quiz'?src.filter(w=>w.en.replace(/[^a-z]/gi,'').length>=2):src.filter(fillOK);const seen=new Set();const pool=ws.filter(w=>!seen.has(w.en)&&seen.add(w.en));
  G={mode:'fill',ws:pool,miss:0,i:0,res:[],lock:false};G.q=sp==='quiz'?shuf(pool):pool.slice().sort((a,b)=>weak(b)-weak(a)).slice(0,10);G.n=G.q.length;
  $('playName').textContent=sp==='quiz'?`小考 W${S.qwk} 星期${DAYN[QDAY]}`:'期末總複習 W9–16';cur.mode='fill';go('play');fill()}
function start(mode){
  cur.mode=mode;cur.special=null;const ws=words(cur.wk).filter(w=>w.img);
  const m=MODES.find(x=>x.id===mode);$('playName').textContent=m.name;
  G={mode,ws,miss:0,i:0,res:[],lock:false};
  if(mode==='memory'){G.q=shuf(ws).slice(0,6);G.n=G.q.length}
  else if(mode==='fill'){G.q=shuf(ws.filter(w=>w.en.replace(/[^a-z]/gi,'').length>=3&&w.en.replace(/[^a-z]/gi,'').length<=12)).slice(0,8);G.n=G.q.length}
  else{G.q=shuf(ws).slice(0,8);G.n=G.q.length}
  go('play');
  if(mode==='memory')memory();else if(mode==='fill')fill();else question();
}
$('quit').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}go(cur.special?'home':'week')};
function prog(){$('prog').innerHTML=Array.from({length:G.n},(_,k)=>`<i class="${G.res[k]===1?'ok':G.res[k]===0?'bad':k===G.i?'now':''}"></i>`).join('')}
const others=(w,n)=>shuf(G.ws.filter(x=>x.en!==w.en&&x.zh!==w.zh&&x.img!==w.img)).slice(0,n);
const SPK='<svg viewBox="0 0 24 24" fill="#fff"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
function question(){
  prog();const w=G.q[G.i];G.tries=0;G.lock=false;
  if(G.mode==='listen'){
    const opts=shuf([w,...others(w,3)]);G.opts=opts;
    $('stage').innerHTML=`<div class="ask"><button class="spk" id="again1" aria-label="再聽一次">${SPK}</button><span class="zh" style="font-size:20px">聽聽看，<br>是哪一張圖？</span></div><div class="grid4">${opts.map((o,k)=>`<button class="tile" data-k="${k}">${imgTag(o)}</button>`).join('')}</div>`;
    $('again1').onclick=()=>say(w.en);setTimeout(()=>say(w.en),300);
  }else{
    const opts=shuf([w,...others(w,2)]);G.opts=opts;G.sel=-1;
    const hp=(G.n-G.res.filter(r=>r===1).length)/G.n*100;
    $('stage').innerHTML=`<div class="boss" id="boss"><svg viewBox="0 0 100 100"><path d="M20 40 Q10 10 30 25 Q50 0 70 25 Q90 10 80 40 Q95 70 75 88 L25 88 Q5 70 20 40Z" fill="#7d4cdb"/><circle cx="38" cy="50" r="9" fill="#fff"/><circle cx="62" cy="50" r="9" fill="#fff"/><circle cx="40" cy="52" r="4" fill="#111"/><circle cx="60" cy="52" r="4" fill="#111"/><path d="M36 70 L42 64 L48 70 L54 64 L60 70 L66 64" stroke="#fff" stroke-width="4" fill="none"/></svg><div class="hp"><i style="width:${hp}%"></i></div></div><div class="pic">${imgTag(w)}</div><div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="sp">${SPK.replace('<svg','<svg width="26" height="26"')}</span><span>${esc(o.en)}</span></button>`).join('')}</div><p class="hint zh">點一下聽聽看，再點一次就選它</p>`;
  }
}
$('stage').addEventListener('click',e=>{
  if(!G||G.lock||G.mode==='memory')return;
  const b=e.target.closest('[data-k]');if(!b)return;const k=+b.dataset.k,o=G.opts[k],w=G.q[G.i];
  if(G.mode==='boss'&&G.sel!==k){G.sel=k;document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));say(o.en);return}
  if(o===w){G.lock=true;b.classList.add('ok');beep(true);say(w.en);toast(w);G.res[G.i]=G.tries?0:1;
    if(G.mode==='boss'){$('boss').classList.add('hit');}
    setTimeout(next,1500)}
  else{G.tries++;G.miss++;b.classList.add('bad');b.disabled=true;beep(false);G.sel=-1;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));
    if(G.tries>=2){G.lock=true;G.res[G.i]=0;const r=document.querySelector(`[data-k="${G.opts.indexOf(w)}"]`);r.classList.add('ok');say(w.en);toast(w,1800);setTimeout(next,2000)}
    else if(G.mode==='listen')setTimeout(()=>say(w.en),500)}
});
function next(){G.i++;if(G.i>=G.n)finish();else if(G.mode==='fill')fill();else question()}
function blanks(en){const pos=[...en].map((c,i)=>/[a-z]/i.test(c)?i:-1).filter(i=>i>=0);const n=Math.max(1,Math.round(pos.length*.4));return new Set(shuf(pos).slice(0,n))}
function fill(){prog();const w=G.q[G.i];G.tries=0;G.lock=false;G.hole=blanks(w.en);G.need=[...G.hole].sort((a,b)=>a-b);G.got=0;
  const miss=G.need.map(i=>w.en[i].toLowerCase());const pool='abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>!miss.includes(c));G.keys=shuf([...miss,...shuf(pool).slice(0,Math.max(3,6-miss.length))]);
  $('stage').innerHTML=`<div class="pic" style="height:min(30vh,240px)">${imgTag(w)}</div><div class="ask"><button class="spk" id="again1" aria-label="再聽一次">${SPK}</button><div class="fw" id="fw"></div></div><div class="keys">${G.keys.map((c,k)=>`<button class="key" data-f="${k}">${c}</button>`).join('')}</div><p class="hint zh">聽聽看，按順序把缺的字母補上</p>`;
  drawFill();$('again1').onclick=()=>say(w.en);setTimeout(()=>say(w.en),300)}
function drawFill(){const w=G.q[G.i];$('fw').innerHTML=[...w.en.toLowerCase()].map((c,i)=>c===' '?'<span class="gap"></span>':G.hole.has(i)?(G.need.indexOf(i)<G.got?`<span class="lt fil">${esc(c)}</span>`:`<span class="lt hole${G.need.indexOf(i)===G.got?' cur':''}">_</span>`):`<span class="lt">${esc(c)}</span>`).join('')}
$('stage').addEventListener('click',e=>{if(!G||G.mode!=='fill'||G.lock)return;const b=e.target.closest('[data-f]');if(!b)return;const w=G.q[G.i],c=G.keys[+b.dataset.f],want=w.en[G.need[G.got]].toLowerCase();
  if(c===want){G.got++;b.disabled=true;b.classList.add('used');drawFill();if(G.got===G.need.length){G.lock=true;beep(true);say(w.en);toast(w);G.res[G.i]=G.tries?0:1;if(G.tries)S.wr[w.en]=(S.wr[w.en]||0)+1;else S.wc[w.en]=(S.wc[w.en]||0)+1;save();setTimeout(next,1600)}}
  else{G.tries++;G.miss++;beep(false);b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');if(G.tries>=3){G.lock=true;G.res[G.i]=0;S.wr[w.en]=(S.wr[w.en]||0)+2;save();G.got=G.need.length;drawFill();say(w.en);toast(w,1800);setTimeout(next,2200)}}});

function memory(){
  const cards=shuf(G.q.flatMap((w,k)=>[{k,t:'i',w},{k,t:'w',w}]));G.cards=cards;G.open=[];G.found=0;G.res=[];G.i=0;
  $('prog').innerHTML='';
  $('stage').innerHTML=`<p class="hint zh" style="margin:0 0 10px">翻兩張牌：圖和英文字一樣就配成一對！</p><div class="mem">${cards.map((c,i)=>`<button class="mc" data-c="${i}">?</button>`).join('')}</div>`;
}
$('stage').addEventListener('click',e=>{
  if(!G||G.mode!=='memory'||G.lock)return;const b=e.target.closest('[data-c]');if(!b||b.classList.contains('up')||b.classList.contains('done'))return;
  const c=G.cards[+b.dataset.c];b.classList.add('up');b.innerHTML=c.t==='i'?imgTag(c.w):`<span class="w">${esc(c.w.en)}</span>`;
  if(c.t==='w')say(c.w.en);G.open.push(b);
  if(G.open.length<2)return;
  const [x,y]=G.open,cx=G.cards[+x.dataset.c],cy=G.cards[+y.dataset.c];G.open=[];
  if(cx.k===cy.k){G.lock=true;setTimeout(()=>{x.classList.add('done');y.classList.add('done');beep(true);say(cx.w.en);toast(cx.w);G.found++;G.lock=false;if(G.found===G.n)setTimeout(finish,1300)},350)}
  else{G.miss++;G.lock=true;setTimeout(()=>{beep(false);[x,y].forEach(z=>{z.classList.remove('up');z.textContent='?'});G.lock=false},1100)}
});

function finish(){
  const lim=G.mode==='memory'?[4,8]:G.mode==='fill'?[2,5]:[1,3];
  const st=G.miss<=lim[0]?3:G.miss<=lim[1]?2:1;
  const before=level(),bag=cur.special?S.bonus:S.st,key=cur.special?today()+cur.special:cur.wk+G.mode,old=bag[key]||0;
  if(st>old){bag[key]=st;save()}
  go('done');drawRocket($('rocketDone'));
  $('doneT').textContent=st===3?'太厲害了！':st===2?'很棒喔！':'完成任務！';
  $('doneSt').innerHTML=starStr(st);
  const up=level()>before;
  $('doneMsg').textContent=(st>old?`火箭加了 ${st-old} 顆星的油！`:'再挑戰看看，拿更多星星！')+(up?` 火箭升級成「${LV[level()][0]}」了！`:'');
  const r=$('rocketDone');r.classList.remove('fly');if(st===3){void r.offsetWidth;setTimeout(()=>r.classList.add('fly'),700)}
}
$('again').onclick=()=>cur.special?startSpecial(cur.special):start(cur.mode);
$('back2').onclick=()=>go(cur.special?'home':'week');
$('goQuiz').onclick=()=>learnFirst();$('goFinal').onclick=()=>startSpecial('final');
$('qwk').innerHTML=WEEKS.map(w=>`<option value="${w}">Week ${w}</option>`).join('');
$('qwk').onchange=e=>{S.qwk=+e.target.value;save();home()};
$('qday').innerHTML=[1,2,3,4,5].map(d=>`<option value="${d}">星期${DAYN[d]}</option>`).join('');
$('qday').onchange=e=>{QDAY=+e.target.value;home()};
home();
}
</script>
</body>
</html>
