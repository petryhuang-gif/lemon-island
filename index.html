<title>檸檬的英語魔法冒險島</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* Layout: storybook stage — the speaking character and dialogue on the left, the quest card on the right; stacks on narrow screens */
:root{
  --sky:#d6eaff; --sky2:#f3e8ff; --cream:#fffaf2; --ink:#3a3366; --ink2:#6c6597;
  --pink:#ff8dbd; --pinkd:#d9548f; --lav:#a894ef; --lavl:#ece6ff; --mint:#7fd3b6;
  --gold:#ffc23d; --line:#e4daf7; --bad:#d94a70; --good:#24906c; --white:#ffffff;
  --f-display:"Baloo 2","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --f-body:"Nunito","Noto Sans TC","PingFang TC",system-ui,sans-serif;
  color-scheme:light;
}
html{min-height:100%}body{min-height:100vh}
body{margin:0;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%);background-color:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent;min-height:100%}
#app{min-height:100%;box-sizing:border-box;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--lav);outline-offset:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;font-weight:800;font-size:18px;background:var(--white);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.main{background:var(--pink);color:var(--white);box-shadow:0 4px 0 var(--pinkd)}
.btn.lav{background:var(--lav);color:var(--white);box-shadow:0 4px 0 #8270cf}
.btn.small{min-height:42px;font-size:15px;padding:0 16px}
.btn:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chip{display:inline-block;padding:2px 12px;border-radius:999px;background:var(--lavl);color:var(--ink2);font-weight:800;font-size:14px;letter-spacing:.03em}
.muted{color:var(--ink2)}

/* home */
.home{display:grid;gap:22px;justify-items:center;text-align:center;padding-top:12px}
.home h1{font-size:clamp(34px,6vw,60px);color:var(--ink)}
.home h1 span{color:var(--pinkd)}
.cast{display:flex;gap:clamp(8px,3vw,32px);align-items:flex-end;justify-content:center;flex-wrap:wrap}
.cast figure{margin:0;display:grid;justify-items:center;gap:4px}
.cast figcaption{font-weight:800;color:var(--ink2);font-size:15px}
.char{width:clamp(96px,16vw,150px);height:auto;display:block}
.progress{width:min(420px,100%);height:14px;border-radius:999px;background:var(--white);overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));border-radius:999px}

/* map */
.map{background:var(--cream);border-radius:28px;padding:22px;box-shadow:0 6px 0 var(--line)}
.map h2{font-size:30px;margin-bottom:4px}
.path{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin:20px 0}
.node{display:grid;justify-items:center;gap:6px;padding:14px 6px;border-radius:22px;background:var(--white);box-shadow:0 4px 0 var(--line);text-align:center;min-width:0}
.node .num{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;font-weight:800;background:var(--lavl);color:var(--ink2)}
.node.done .num{background:var(--gold);color:var(--ink)}
.node.next .num{background:var(--pink);color:var(--white);animation:pulse 1.6s ease-in-out infinite}
.node.locked{opacity:.45;cursor:not-allowed}
.node b{font-size:14px;line-height:1.3}
.node small{font-size:12px;color:var(--ink2);font-weight:700}
@keyframes pulse{50%{transform:scale(1.08)}}
.shelf{display:flex;flex-wrap:wrap;gap:8px}
.treasure{background:var(--white);border-radius:14px;padding:6px 12px;font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--line)}

/* task */
.stage{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;align-items:start}
.side{display:grid;gap:12px;justify-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.bubble{background:var(--white);border-radius:22px;padding:14px 16px;font-size:17px;box-shadow:0 4px 0 var(--line);position:relative;width:100%;box-sizing:border-box}
.bubble::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--white)}
.bubble .who{font-weight:800;color:var(--pinkd);font-size:14px;display:block;margin-bottom:2px}
.hintbox{display:grid;gap:8px;width:100%}
.hint{background:var(--lavl);border-radius:16px;padding:10px 14px;font-size:16px}
.hint b{color:var(--ink2);font-size:13px;display:block}
.hint.ans{background:#fff2c9}
.card{background:var(--cream);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--line);min-width:0}
.card h2{font-size:28px}
.prompt{font-family:var(--f-display);font-size:22px;font-weight:600;margin:6px 0 14px;color:var(--ink)}
.qbody{display:grid;gap:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.opt{background:var(--white);border-radius:22px;min-height:150px;display:grid;place-items:center;box-shadow:0 4px 0 var(--line);padding:10px;position:relative}
.opt.nope{animation:shake .4s;box-shadow:0 0 0 4px var(--bad)}
.opt.okk{box-shadow:0 0 0 4px var(--good)}
.opt.glow{box-shadow:0 0 0 5px var(--gold),0 0 24px var(--gold)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.e{font-size:44px;line-height:1}
.e.xl{font-size:76px}.e.sm{font-size:32px}
.combo{display:flex;align-items:flex-end;justify-content:center;gap:2px}
.letter{background:var(--white);border-radius:18px;padding:16px 20px;font-size:18px;line-height:1.7;box-shadow:0 3px 0 var(--line);border:2px dashed var(--line)}
.letter p{margin:0 0 6px}
.fld{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:19px;font-weight:700}
.fld input{font:inherit;font-size:22px;width:9em;max-width:100%;padding:8px 12px;border-radius:14px;border:3px solid var(--line);background:var(--white);color:var(--ink)}
.fld input.bad{border-color:var(--bad)}
.fld input.ok{border-color:var(--good)}
.qa{display:grid;gap:10px;background:var(--white);border-radius:18px;padding:14px;box-shadow:0 3px 0 var(--line)}
.qa .q{font-size:19px;font-weight:800}
.choices{display:grid;gap:8px}
.choice{text-align:left;padding:12px 16px;border-radius:14px;background:var(--lavl);font-size:18px;font-weight:700;border:3px solid transparent}
.choice.sel{border-color:var(--lav);background:var(--white)}
.choice.bad{border-color:var(--bad)}
.palette{display:flex;gap:12px;flex-wrap:wrap}
.swatch{width:58px;height:58px;border-radius:50%;box-shadow:0 3px 0 var(--line);border:4px solid var(--white)}
.swatch.sel{border-color:var(--ink)}
.pic{background:var(--white);border-radius:20px;padding:8px;box-shadow:0 3px 0 var(--line);overflow-x:auto}
.pic svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.part{cursor:pointer}
.part.sel{stroke:var(--gold);stroke-width:6}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.fb{min-height:28px;font-weight:800;font-size:18px;margin-top:12px}
.fb.bad{color:var(--bad)}.fb.good{color:var(--good)}
.peek{margin-top:14px;font-size:14px;color:var(--ink2)}
.peek summary{cursor:pointer;font-weight:700}
.peek p{margin:6px 0 0;background:var(--white);border-radius:12px;padding:8px 12px}
.win{display:grid;gap:12px;justify-items:center;text-align:center;background:var(--white);border-radius:22px;padding:20px;margin-top:14px;box-shadow:0 4px 0 var(--line)}
.win .big{font-size:56px;animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.model{background:#fff2c9;border-radius:16px;padding:12px 16px;font-size:18px;font-weight:700}
.rates{display:flex;flex-wrap:wrap;gap:10px}

/* end + parent */
.end{display:grid;gap:18px;justify-items:center;text-align:center}
.end h1{font-size:clamp(30px,5vw,48px)}
.glowstar{width:160px;height:auto;filter:drop-shadow(0 0 18px var(--gold));animation:pop .8s ease-out}
.panel{background:var(--cream);border-radius:24px;padding:20px;box-shadow:0 5px 0 var(--line);display:grid;gap:14px;min-width:0}
.panel h2{font-size:24px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--ink2);font-size:13px;letter-spacing:.03em}
textarea{width:100%;box-sizing:border-box;min-height:90px;font:14px/1.4 ui-monospace,Menlo,monospace;border-radius:12px;border:2px solid var(--line);padding:10px;background:var(--white);color:var(--ink)}
.note{background:var(--lavl);border-radius:14px;padding:10px 14px;font-size:15px}

.spellcard{display:grid;gap:14px;justify-items:center;text-align:center;max-width:620px;margin:0 auto;width:100%;box-sizing:border-box}
.spellpic{font-size:96px;line-height:1.1}
.spellform{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.spellform input{font:inherit;font-size:30px;letter-spacing:.08em;text-align:center;width:9em;max-width:100%;padding:8px 12px;border-radius:16px;border:3px solid var(--line);background:var(--white);color:var(--ink)}
.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tile{min-width:40px;height:48px;display:grid;place-items:center;border-radius:12px;font-size:26px;font-weight:800;background:var(--white);box-shadow:0 3px 0 var(--line)}
.tile.ok{background:#d9f5ea;color:var(--good)}.tile.bad{background:#ffe0e8;color:var(--bad)}.tile.miss{color:var(--ink2)}
.scene{position:relative;width:min(460px,100%);aspect-ratio:16/10;background:linear-gradient(180deg,#e6f3ff,#fff7e6);border-radius:20px;box-shadow:0 3px 0 var(--line);overflow:hidden}
.scene span{position:absolute;line-height:1}
.scene.room{background:linear-gradient(180deg,#fdebd3 0 64%,#caa27a 64% 100%)}
.scene .blk{position:absolute;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.scene .tbl{position:absolute;height:10px;background:#b98a5e;border-radius:4px;box-shadow:12px 10px 0 -2px transparent}
.scene .tbl::before,.scene .tbl::after{content:"";position:absolute;top:10px;width:8px;height:56px;background:#b98a5e}
.scene .tbl::before{left:8px}.scene .tbl::after{right:8px}
.fld input.ok,.qa input.ok{border-color:var(--good)!important}.fld input.bad,.qa input.bad{border-color:var(--bad)!important}
.praise{font-family:var(--f-display);font-size:34px;font-weight:800;color:var(--good);animation:pop .4s ease-out}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;background:var(--white);border-radius:18px;padding:10px;box-shadow:0 3px 0 var(--line)}
.bk{display:grid;justify-items:center;gap:2px;padding:6px;border:2px solid var(--line);border-radius:12px}
.bk .e{font-size:34px}.bl{font-weight:800;font-size:16px}
.passage{line-height:2.4}
.gapw{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;vertical-align:middle;margin:0 2px}
.gapin{font:inherit;font-size:18px;width:7.5em;max-width:60vw;padding:2px 8px;border-radius:10px;border:3px solid var(--line);background:var(--white);color:var(--ink)}
.gapin.ok{border-color:var(--good)}.gapin.bad{border-color:var(--bad)}
.gopts{font-size:13px;color:var(--ink2);font-weight:700;background:var(--lavl);border-radius:8px;padding:0 6px}
.fld input.ok{border-color:var(--good)}.fld input.bad{border-color:var(--bad)}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px}
.chap{display:flex;align-items:center;gap:12px;text-align:left;background:var(--white);border-radius:22px;padding:14px;box-shadow:0 4px 0 var(--line);font:inherit;color:inherit}
.chap.locked{opacity:.5}
.chapt{display:grid;gap:2px;min-width:0}.chapt b{font-family:var(--f-display);font-size:20px}.chapt small{color:var(--ink2);font-weight:700}
.mini{width:56px;height:56px;flex:none}
.lemonbg{border-radius:24px;padding:8px 12px 0;box-shadow:0 4px 0 var(--line)}
.ward{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:20px;align-items:start}
.wprev{display:grid;justify-items:center}.wprev figure{margin:0;display:grid;justify-items:center;gap:6px;font-weight:800;color:var(--ink2)}.wprev .char{width:min(200px,60vw)}
.wshop{display:grid;gap:12px}
.witems{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.witem{display:grid;justify-items:center;gap:4px;padding:12px 8px;border-radius:18px;background:var(--white);box-shadow:0 3px 0 var(--line);border:3px solid transparent;font:inherit;color:inherit;text-align:center}
.witem.on{border-color:var(--lav)}.witem.pend{border-color:var(--gold)}
.witem .e{font-size:36px}.witem b{font-size:15px}
.sw{width:44px;height:44px;border-radius:50%;display:block;box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--line)}
.tag{font-size:12px;font-weight:800;color:var(--ink2)}.tag.lockt{color:#8a7a9c}.witem.wlocked .wthumb{filter:grayscale(.85) opacity(.55)}.witem .rwbar{height:6px}.tag.on{color:var(--good)}.tag.buy{color:#b07a00}
@media (max-width:640px){.ward{grid-template-columns:minmax(0,1fr)}}
.answord{font-size:34px;letter-spacing:.1em}
@media (max-width:820px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .side{position:static;grid-template-columns:96px minmax(0,1fr);justify-items:stretch;align-items:start}
  .side .char{width:96px}
  .bubble::before{display:none}
  .hintbox{grid-column:1/-1}
  .path{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== Pastel illustrated theme ===== */
body{background:linear-gradient(135deg,#f3eaff,#d3eeff 52%,#ffe1f1);background-color:#f6ecff;color:#5e3f78}
#pagebg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transition:opacity .4s}
#pagebg.on{opacity:1}
#pagebg::after{content:"";position:absolute;inset:0;background:rgba(255,248,253,.38)}
#app{position:relative;z-index:1}
h1,h2,h3{font-family:"Baloo 2","Noto Sans TC","PingFang TC",system-ui,sans-serif;font-weight:900}
.map,.card,.panel,.end{background:rgba(255,252,254,.9);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:4px solid #fff;border-radius:28px;box-shadow:0 10px 28px rgba(123,92,158,.25)}
.end{padding:24px max(16px,3vw)}
.map h2,.card h2,.panel h2,.end h1,.end h2{color:#ad3f8d}
.chip{background:rgba(255,255,255,.92);color:#9d4fa8;border:2px solid #fff;box-shadow:0 3px 10px rgba(150,100,170,.18)}
.btn{background:#fff;color:#a257a2;border:3px solid #f1d2f0;box-shadow:0 4px 0 #e5c3ea}
.btn.main{background:linear-gradient(#ff96d1,#ec5fad);color:#fff;border:3px solid #fff;box-shadow:0 4px 0 #bb5aa0,0 8px 16px rgba(200,100,170,.4);text-shadow:0 1px 0 rgba(150,30,100,.35)}
.btn.lav{background:linear-gradient(#c8b6ff,#8c7cd6);color:#fff;border:3px solid #fff;box-shadow:0 4px 0 #6f5fb8,0 8px 16px rgba(120,100,200,.35);text-shadow:0 1px 0 rgba(60,40,140,.35)}
.btn{position:relative;overflow:hidden}
.btn.main::after,.btn.lav::after{content:"";position:absolute;left:12%;right:12%;top:3px;height:38%;border-radius:999px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.bubble{border:3px solid #fff;box-shadow:0 6px 16px rgba(150,100,170,.22)}
.opt,.qa,.letter,.bank,.pic{border:2px solid #f3e1f6}
.praise{color:#ec4fa4}
.win{border:3px solid #ffe2a0;box-shadow:0 0 22px rgba(255,205,90,.55)}
/* home */
.homeL{display:grid;gap:16px}
.hero{position:relative;border:5px solid #fff;border-radius:28px;overflow:hidden;box-shadow:0 12px 30px rgba(123,92,158,.3);background:#fff}
.hero img{display:block;width:100%;height:auto}
.heroText{position:absolute;right:18px;top:18px;width:min(430px,46%);background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:3px solid #fff;border-radius:24px;padding:18px;display:grid;gap:10px}
.heroText h1{margin:0;font-size:clamp(24px,3.4vw,40px);color:#ad338d;text-shadow:0 2px 0 #fff;line-height:1.15}
.heroText h1 span{color:#8558b2}
.heroText p{margin:0;font-weight:700;color:#6a4a83}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.heroText .progress{width:100%}
@media (max-width:760px){.heroText{position:static;width:auto;border-radius:0;border:0;border-top:3px solid #fff}}
.today{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.today .tpic{width:120px;height:auto;filter:drop-shadow(0 4px 8px rgba(110,70,140,.3))}
.today h2{font-size:22px;margin:0}.today p{margin:6px 0 10px;font-weight:600;color:#6a4a83}
.tbody{display:grid;gap:8px;min-width:0}
.tsteps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tstep{display:grid;gap:2px;background:#fff;border:2px solid #f3e1f6;border-radius:16px;padding:8px 12px}
.tstep b{font-size:15px;color:#ad338d}.tstep small{font-size:12.5px;color:#7a5a93;font-weight:700}
.tstep.ok{border-color:#9be3c2;background:#f0fff8}
.chcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.chcard{display:grid;align-content:start;gap:4px;text-align:left;padding:14px;border-radius:22px;background:rgba(255,252,254,.92);border:3px solid #fff;box-shadow:0 6px 16px rgba(123,92,158,.2);font:inherit;color:#5e3f78;min-width:0}
.chcard .cic{font-size:30px}.chcard small{font-weight:800;color:#9c6ac0}.chcard b{font-size:17px;color:#6a3f86;line-height:1.3}
.chcard .csk{font-size:12.5px;font-weight:700;color:#8a6aa6;background:#f6eefc;border-radius:10px;padding:2px 8px;justify-self:start}
.chcard .progress{height:10px;margin-top:4px;width:100%}
.chcard .cst{font-size:13px;font-weight:800;color:#ad338d}
.chcard.locked{opacity:.6;filter:grayscale(.4)}.chcard.locked .cst{color:#8a7a9c}
.chcard.done{border-color:#ffe2a0;box-shadow:0 0 18px rgba(255,205,90,.5)}
.foot{justify-self:center;text-align:center;font-size:12.5px;color:#7a5a93;margin:4px 0 0;background:rgba(255,255,255,.85);border-radius:16px;padding:6px 14px}
@media (max-width:900px){.chcards{grid-template-columns:repeat(2,minmax(0,1fr))}.tsteps{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.today{grid-template-columns:minmax(0,1fr)}.today .tpic{display:none}}
.wimg{max-width:240px}
.wthumb{width:auto;height:96px;filter:drop-shadow(0 3px 5px rgba(110,70,140,.3))}
.react{display:flex;align-items:center;gap:10px}.react img{width:78px;height:auto}
.hintimg{width:110px;height:auto;justify-self:center}
.winimg{width:min(170px,40vw);height:auto;animation:pop .5s ease-out;filter:drop-shadow(0 4px 8px rgba(110,70,140,.3))}
.thinkimg{width:110px;height:auto}
.praise{display:flex;align-items:center;gap:8px}.praise img{width:110px;height:auto}
.story{display:grid;gap:12px;justify-items:center}

/* ---------- speech ---------- */
var hasTTS=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";
var voice=null;
function pickVoice(){if(!hasTTS)return;var vs=speechSynthesis.getVoices()||[];
  if(state&&state.voiceURI){var mine=vs.filter(function(v){return v.voiceURI===state.voiceURI})[0];if(mine){voice=mine;return;}}
  var en=vs.filter(function(v){return /^en/i.test(v.lang)}),gb=en.filter(function(v){return /en[-_]GB/i.test(v.lang)});
  var good=function(list){return list.filter(function(v){return /enhanced|premium|增強|高品質/i.test(v.name)})[0]||list.filter(function(v){return /Serena|Kate|Daniel|Martha|Arthur|Stephanie/i.test(v.name)})[0];};
  voice=good(gb)||gb[0]||good(en)||en[0]||null;}
if(hasTTS){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){}}
var SPEEDS=[{label:"🙂 正常速度",rate:1.0,gap:300,lgap:300},{label:"🐢 稍慢",rate:0.85,gap:500,lgap:400}];
function spd(){var i=(state&&typeof state.speed==="number")?state.speed:0;return SPEEDS[i]||SPEEDS[0];}
var spkToken=0;
function stopSpeak(){spkToken++;if(!hasTTS)return;try{speechSynthesis.cancel();}catch(e){}}
function chunkText(text){
  var out=[],sents=String(text).match(/[^.!?]+[.!?]*/g)||[text];
  sents.forEach(function(se){
    se=se.trim();if(!se)return;
    var m=se.match(/^(.*?)((?:\b[A-Z],\s*)+[A-Z]\b\.?)$/);
    if(m){
      var pre=m[1].replace(/[,\s]+$/,"").trim();
      var grp=m[2].replace(/\.?$/,".");
      if(pre&&pre.split(/\s+/).length<=2)out.push({t:pre+" "+grp,letter:true});
      else{if(pre)out.push({t:pre,letter:false});out.push({t:grp,letter:true});}
    }else out.push({t:se,letter:false});
  });
  return out;
}
function speak(text){speakSeq([{text:text}]);}
function speakSeq(seq,onDone){
  if(!hasTTS||!seq||!seq.length)return;
  if(!voice)pickVoice();
  var parts=[];seq.forEach(function(x,j){chunkText(x.text).forEach(function(c,ci){c.pitch=x.pitch||1;c.turn=(ci===0&&j>0);if(ci===0&&x.pause)c.pre=x.pause;parts.push(c);});});
  stopSpeak();var tok=spkToken,i=0,sp=spd();
  function next(){
    if(tok!==spkToken)return;
    if(i>=parts.length){if(onDone){var f=onDone;onDone=null;f();}return;}
    var p=parts[i++];
    try{var u=new SpeechSynthesisUtterance(p.t);if(voice){u.voice=voice;u.lang=voice.lang}else{u.lang="en-GB"}
      u.rate=p.letter?sp.rate*0.8:sp.rate;u.pitch=p.pitch||1;
      var done=false;var go=function(){if(done)return;done=true;setTimeout(next,(parts[i]&&parts[i].pre)?parts[i].pre:((parts[i]&&parts[i].turn)?sp.gap+350:(p.letter?sp.lgap:sp.gap)));};
      u.onend=go;u.onerror=go;speechSynthesis.speak(u);}catch(e){}
  }
  setTimeout(next,60);
}

function check(){
  var t=cur.t;cur.attempts++;
  if(t.type==="match"){
    if(Object.keys(cur.asg).length<t.names.length){cur.attempts--;setFB("每個名字都要放到一個人或一張圖上喔！","bad");return;}
    var bm={},okm=true;t.names.forEach(function(n){if(cur.asg[n]!==t.answer[n]){bm[n]=1;okm=false;}});cur.mbad=okm?null:bm;rerenderBody();
    if(okm)complete();else wrong();return;
  }
  if(t.type==="multipick"){
    if(Object.keys(cur.sel).length<t.questions.length){cur.attempts--;setFB("每一題都要選一張圖喔！","bad");return;}
    var bq={},okq=true;t.questions.forEach(function(q,k){if(cur.sel[k]!==q.answer){bq[k]=1;okq=false;}});cur.badQ=okq?null:bq;rerenderBody();
    if(okq)complete();else wrong();return;
  }
  if(t.type==="fields"){
    var all=true;
    t.fields.forEach(function(f,k){
      var el=document.getElementById(t.id+"f"+k);var v=norm(el&&el.value);
      var ok=f.accept.indexOf(v)>=0;
      if(el){el.classList.toggle("ok",ok);el.classList.toggle("bad",!ok);}
      if(!ok)all=false;
    });
    if(all)complete();else{wrong();}
    return;
  }
  if(t.type==="passage"){
    var allp=true,badp={};
    t.gaps.forEach(function(g,k){var el=document.getElementById(t.id+"f"+k);var v=norm(el&&el.value);var ok=g.accept.indexOf(v)>=0;if(el){el.classList.toggle("ok",ok);el.classList.toggle("bad",!ok);}if(!ok)allp=false;});
    if(t.titleQ){if(!cur.sel[99]){cur.attempts--;setFB("最後一題要選一個標題喔！","bad");return;}if(cur.sel[99]!==t.titleQ.answer){allp=false;badp[99]=true;}cur.badQ=badp;rerenderBody();}
    if(allp)complete();else wrong();
    return;
  }
  if(t.type==="choice"){
    var allc=true,bad={};
    t.questions.forEach(function(q,k){if(cur.sel[k]!==q.answer){allc=false;bad[k]=true;}});
    if(Object.keys(cur.sel).length<t.questions.length){cur.attempts--;setFB("每一題都要選一個答案喔！","bad");return;}
    cur.badQ=bad;rerenderBody();
    if(allc)complete();else wrong();
    return;
  }
  if(t.type==="colour"){
    var f=cur.fills,parts=t.parts||["roof","door","win1","win2"],ans=t.colourAns?(Array.isArray(t.colourAns)?t.colourAns:[t.colourAns]):[{part:"win1",col:"pink"}];
    if(!Object.keys(f).length){cur.attempts--;setFB("先點圖上的一個地方，再點顏色。","bad");return;}
    var targ={};ans.forEach(function(a){targ[a.part]=a.col;});
    var okc=ans.every(function(a){return f[a.part]===a.col;})&&parts.every(function(p){return targ[p]||!f[p];});
    var wel=t.write?document.getElementById(t.id+"w"):null,wok=!t.write||(wel&&t.write.accept.indexOf(norm(wel.value))>=0);
    if(wel){wel.classList.toggle("ok",wok);wel.classList.toggle("bad",!wok);}
    if(okc&&wok)complete();else wrong();
  }
}

function complete(){
  var t=cur.t;
  var rec=state.tasks[t.id]||{plays:0};
  var revealed=cur.level>=4&&t.type!=="speak",isSpeak=t.type==="speak";
  var firstTime=!rec.done&&!revealed;
  rec.plays=(rec.plays||0)+1;rec.lastAt=nowISO();
  rec.lastTries=cur.attempts;rec.lastHints=Math.min(cur.level,4);
  if(!rec.firstAt){rec.firstTries=cur.attempts;rec.firstHints=Math.min(cur.level,4);rec.firstAt=rec.lastAt;}
  var egain=0;
  if(isSpeak){rec.done=true;}
  else if(revealed){rec.retry=true;}
  else{egain=firstTime?(3+(cur.level===0?2:0)):1;rec.done=true;rec.retry=false;}
  addEnergy(egain);
  state.tasks[t.id]=rec;
  var md=missionToday();if(md.ids.indexOf(t.id)>=0)md.done[t.id]=true;markMissionDay();
  state.log.push({id:t.id,at:rec.lastAt,tries:cur.attempts,hints:Math.min(cur.level,4)});
  if(state.log.length>500)state.log=state.log.slice(-500);
  save();
  var independent=cur.level===0&&!isSpeak;
  setFB(revealed?"改好了！":praise(),"good");
  var nm=nextMission(),chapEnd=!revealed&&firstOpen()>=TASKS.length&&!(state.chapEndSeen||{})[CHAPTERS[curChap].id];
  var nextBtn=chapEnd?'<button class="btn main" data-act="end">'+CHAPTERS[curChap].endBtn+'</button>':(nm?'<button class="btn main" data-act="mgo">下一個任務 →</button>':'<button class="btn main" data-act="home">今天的任務完成了 🎉</button>');
  var a=document.getElementById("actions");
  if(a)a.innerHTML='<div class="win" style="width:100%"><img class="winimg" src="'+(revealed?'img/lemon_think.webp':'img/lemon_jump.webp')+'" alt="檸檬">'+
    '<div style="font-weight:800;font-size:20px">'+(revealed?"這關明天再挑戰！":(isSpeak?"說得好！":(firstTime?"過關了！":"再次過關！")))+'</div>'+
    (egain?'<div class="chip" style="font-size:16px">⚡ +'+egain+' 魔法能量</div>':'')+
    (revealed?'<div class="muted">看了答案不算過關，也沒有能量。明天會換一組題目，自己做出來就能拿到能量！</div>':(independent?'<div class="chip">沒用提示就答對，好厲害！</div>':(isSpeak?'<div class="muted">口說練習完成。晚上可以跟爸爸媽媽再說一次給他們聽！</div>':'<div class="muted">用了提示也沒關係，下次試試看自己完成。</div>')))+
    '<div class="row" style="justify-content:center">'+nextBtn+'<button class="btn" data-act="map">回地圖</button></div></div>';
  var hb=document.getElementById("hintbox");if(hb)hb.innerHTML="";
  if(hasTTS)speak(independent?"Great job!":"Well done!");
}

function dayIdx(){var d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5);}
function sp(){if(!state.spell)state.spell={words:{},letters:{},names:{n:0,ok:0},sessions:[]};var s=state.spell;s.words=s.words||{};s.letters=s.letters||{};s.names=s.names||{n:0,ok:0};s.sessions=s.sessions||[];return s;}
var GAP=[0,1,2,4,7,14];
function pickLetters(n){
  var s=sp(),pool=[];
  LETTERS.forEach(function(L){var r=s.letters[L]||{n:0,bad:0};var w=1+r.bad*3+(r.n===0?1:0);for(var k=0;k<w;k++)pool.push(L);});
  var out=[];while(out.length<n&&pool.length){var L=pool[Math.floor(Math.random()*pool.length)];if(out.indexOf(L)<0)out.push(L);pool=pool.filter(function(x){return x!==L});}
  return out;
}
function pickWords(n){
  var s=sp(),today=dayIdx();
  var POOL=spellPool();
  var due=POOL.filter(function(w){var r=s.words[w[0]];return r&&r.due<=today;}).sort(function(a,b){return s.words[a[0]].box-s.words[b[0]].box;});
  var out=due.slice(0,Math.min(n,3));
  if(out.length<n){
    var mv=SPELLM.filter(function(w){return !s.words[w[0]];}),st=WORDS.filter(function(w){return w[2]==="S"&&!s.words[w[0]];});
    out=out.concat(mv.concat(st).slice(0,n-out.length));
  }
  if(out.length<n){out=out.concat(due.slice(out.length,n));}
  if(out.length<n){var rest=POOL.filter(function(w){return out.indexOf(w)<0}).sort(function(a,b){return (s.words[a[0]]||{}).due-(s.words[b[0]]||{}).due;});out=out.concat(rest.slice(0,n-out.length));}
  return out;
}
function pickNames(n){var a=NAMES.slice(),out=[];while(out.length<n){out.push(a.splice(Math.floor(Math.random()*a.length),1)[0]);}return out;}
var spS=null;
function sayItem(it){

  if(it.k==="word"){speakSeq([{text:it.a+"."},{text:it.a+".",pause:1300}]);return;}
  speak(spSay(it));
}
function spSay(it){
  if(it.k==="letter")return (LETTER_SAY[it.a]||it.a.toUpperCase())+".";
  if(it.k==="word")return it.a+". "+it.a+".";
  return "What's your name? "+it.a+". How do you spell that? "+it.a.toUpperCase().split("").join(", ")+".";
}
function startSpell(){
  cur=null;

  pickLetters(lettersNeeded()).forEach(function(L){items.push({k:"letter",a:L});});
  var rl=pickRec();if(rl.length)items.push({k:"rec",list:rl,j:0});
  pickWords(4).forEach(function(w){items.push({k:"word",a:w[0],e:w[1],lv:w[2]});});
  pickNames(1).forEach(function(nm){items.push({k:"name",a:nm});});
  var bk=bigKind();
  if(bk==="dialog")items.push({k:"dialog",d:pickLeast(DIALOGS,"dlg")});
  else if(bk==="pic")items.push({k:"pic",p:pickLeast(PICS,"pic")});
  else if(bk==="read")items.push({k:"read",r:pickRead()});
  else if(bk==="def")items.push(makeDef());

function diffTiles(typed,ans){
  var h="",t=typed.toLowerCase(),a=ans.toLowerCase();
  for(var i=0;i<Math.max(t.length,a.length);i++){
    var c=t[i]||"";
    if(!c){h+='<span class="tile miss">_</span>';continue;}
    h+='<span class="tile '+(c===a[i]?"ok":"bad")+'">'+esc(c)+'</span>';
  }
  return '<div class="tiles" aria-label="你寫的字母，綠色是對的位置">'+h+'</div>';
}

function recordSpell(it,ok,typed){
  var s=sp(),today=dayIdx();
  if(it.k==="letter"){var r=s.letters[it.a]||{n:0,bad:0,conf:{}};r.n++;if(!ok){r.bad++;var t=(typed||"").toLowerCase().slice(0,1)||"?";r.conf[t]=(r.conf[t]||0)+1;}else if(r.bad>0&&r.n%3===0){r.bad--;}s.letters[it.a]=r;}
  else if(it.k==="word"){var w=s.words[it.a];var isNew=!w;w=w||{box:0,due:today,ok:0,bad:0};
    if(ok){w.ok++;w.box=isNew?3:Math.min(w.box+1,5);}else{w.bad++;w.box=1;}
    w.due=today+GAP[w.box];w.last=today;s.words[it.a]=w;}
  else{s.names.n++;if(ok)s.names.ok++;}
}
function praiseThen(word,fn){
  spS.busy=true;

  document.querySelectorAll(".spellcard input,.spellcard textarea,.spellcard button").forEach(function(b){b.disabled=true;});
  var called=false,go=function(){if(called)return;called=true;setTimeout(function(){if(spS){spS.busy=false;fn();}},250);};
  if(hasTTS){speakSeq([{text:word}],go);setTimeout(go,3000);}else setTimeout(go,700);
}
function submitSpell(){
  if(spS&&spS.busy)return;
  var it=spS.items[spS.i];
  if(it.k==="dialog"||it.k==="pic"||it.k==="read"||it.k==="def"){submitBig();return;}
  if(it.k==="rec"||it.k==="pos")return;
  var inp=document.getElementById("spin");
  var v=norm(inp&&inp.value).replace(/\s+/g,"");
  if(!v){return;}
  var ok=v===it.a.toLowerCase();
  if(spS.mode==="copy"){
    if(ok){nextSpell();}else{spS.typed=v;renderSpellItem();}
    return;
  }
  if(ok){
    spS.res.push({k:it.k,a:it.a,ok:spS.tries===0});
    if(spS.tries===0)recordSpell(it,true,v);
    praiseThen(spS.tries===0?"Great!":"Good!",nextSpell);return;
  }
  spS.typed=v;
  if(spS.tries===0){recordSpell(it,false,v);spS.tries=1;spS.mode="retry";}
  else{spS.res.push({k:it.k,a:it.a,ok:false});spS.mode="copy";}
  renderSpellItem();
}

function submitBig(){

    spS.own=t.trim();spS.stage="rate";renderBig();return;
  }
  var vals=[],marks=[],all=true,keep={};
  var nF=it.k==="dialog"?it.d.fields.length:(it.k==="read"||it.k==="def"?3:2);
  for(var k=0;k<nF;k++){var el=document.getElementById("sf"+k);vals[k]=el?el.value:"";keep[k]=vals[k];}
  if(vals.some(function(v){return !v.trim()})){setFB2("每一格都要寫喔！");return;}
  if(it.k==="dialog"){it.d.fields.forEach(function(f,k){var ok=f.accept.indexOf(norm(vals[k]))>=0;marks[k]=ok;if(!ok)all=false;});}
  else if(it.k==="read"){READS[it.r].q.forEach(function(q,k){var ok=q[2].indexOf(norm(vals[k]))>=0;marks[k]=ok;if(!ok)all=false;});}
  else if(it.k==="def"){it.qs.forEach(function(q,k){var v=norm(vals[k]),a=q[1].toLowerCase(),ok=v===a||v===a.replace(/^(a|an) /,"");marks[k]=ok;if(!ok)all=false;});}

  spS.marks=marks;spS.keep=keep;
  if(all){
    if(spS.tries===0)spS.firstOK=true;
    if(it.k==="pic"){spS.stage="own";spS.marks=null;spS.keep=null;spS.mode="ask";if(hasTTS)speak("Great!");renderBig();return;}

function allTaskRefs(){var out=[];CHAPTERS.forEach(function(ch,c){ch.tasks.forEach(function(t,i){out.push({c:c,i:i,t:t});});});return out;}
function findTask(id){var a=allTaskRefs();for(var k=0;k<a.length;k++)if(a[k].t.id===id)return a[k];return null;}
function isWeakTask(t){return t.type==="colour"||t.type==="fields";}
function genMission(n,excl){
  excl=excl||[];var refs=allTaskRefs().filter(function(r){return chapOpen(r.c)&&excl.indexOf(r.t.id)<0;});
  function rec(r){return state.tasks[r.t.id]||{};}
  function byOld(a,b){return String(rec(a).lastAt||"").localeCompare(String(rec(b).lastAt||""));}
  var retry=refs.filter(function(r){return rec(r).retry;}).sort(byOld);
  var undone=refs.filter(function(r){return !rec(r).done&&!rec(r).retry;});
  var replay=refs.filter(function(r){return rec(r).done&&!rec(r).retry;}).sort(byOld);
  var picks=[];function take(r){if(r&&picks.indexOf(r.t.id)<0&&picks.length<n)picks.push(r.t.id);}
  if(!excl.length){take(retry[0]||undone.filter(function(r){return isWeakTask(r.t)})[0]||replay.filter(function(r){return isWeakTask(r.t)})[0]);}
  undone.forEach(take);retry.forEach(take);replay.forEach(take);
  var order={};allTaskRefs().forEach(function(r,k){order[r.t.id]=k;});
  return picks.sort(function(a,b){return order[a]-order[b];});
}

  if(act==="skiptrain"){state.skipTraining=!state.skipTraining;save();renderParent();return;}
  if(act==="unlock"){state.unlockAll=!state.unlockAll;save();renderParent();return;}
  if(act==="task"){var i=+el.getAttribute("data-i");if(canPlay(TASKS[i].id))renderTask(i);else toast(state.tasks[TASKS[i].id]&&state.tasks[TASKS[i].id].done&&missionToday().done[TASKS[i].id]?"這關今天做過了，明天再來！":"這關不是今天的任務。看首頁的任務清單喔！");return;}
  if(act==="next"){renderTask(Math.min(cur.i+1,TASKS.length-1));return;}
  if(act.indexOf("sp-")===0)return;
  if(!cur&&["copy","import","reset"].indexOf(act)<0)return;
  var t=cur&&cur.t;
  switch(act){
    case "say":
      if(t.type==="speak")speak(t.steps[cur.step].q);
      else if(hasTTS){if(!examPlay('main'))break;if(t.lines)playLines(t.lines);else speak(t.say);}
      else{var d=document.querySelector(".peek");if(d)d.open=true;}
      break;
    case "msel":cur.msel=el.getAttribute("data-id");cur.mbad=null;rerenderBody();break;
    case "mtgt":
      if(!cur.msel){var gid=el.getAttribute("data-id");Object.keys(cur.asg).forEach(function(n){if(cur.asg[n]===gid)delete cur.asg[n];});rerenderBody();break;}
      var tid=el.getAttribute("data-id");Object.keys(cur.asg).forEach(function(n){if(cur.asg[n]===tid)delete cur.asg[n];});cur.asg[cur.msel]=tid;
      var nx=t.names.filter(function(n){return !cur.asg[n]})[0];cur.msel=nx||null;cur.mbad=null;rerenderBody();break;
    case "mpick":cur.sel[+el.getAttribute("data-q")]=el.getAttribute("data-id");cur.badQ=null;rerenderBody();break;
    case "mplay":var mq=+el.getAttribute("data-q");if(hasTTS){if(examPlay("q"+mq))playLines(t.questions[mq].lines);}else{var dd=document.querySelectorAll(".peek");if(dd.length)dd[dd.length-1].open=true;}break;
    case "hint":
      if(cur.level<2){raiseLevel();setFB("提示出現了，看一看再試一次。","");}else if(cur.level<4)setFB("提示用完了。再仔細想一想，你一定可以！","");
      break;
    case "check":check();break;
    case "pick":
      var id=el.getAttribute("data-id");cur.attempts++;
      if(id===t.answer){el.classList.add("okk");complete();}
      else{cur.flash=id;rerenderBody();cur.flash=null;wrong();}
      break;
    case "choose":
      cur.sel[+el.getAttribute("data-q")]=el.getAttribute("data-id");cur.badQ=null;rerenderBody();setFB("","");break;
    case "part":
      cur.part=el.getAttribute("data-id");rerenderBody();break;
    case "paint":
      if(!cur.part){setFB("先點房子的一個地方，再點顏色。","bad");break;}
      cur.fills[cur.part]=el.getAttribute("data-id");cur.part=null;rerenderBody();setFB("","");break;
    case "clearpaint":cur.fills={};cur.part=null;rerenderBody();break;
    case "starter":cur.starter=true;cur.level=Math.max(cur.level,1);rerenderBody();break;
    case "spoke":cur.phase="rate";rerenderBody();if(hasTTS)stopSpeak();break;
    case "saymodel":speak(t.steps[cur.step].model);break;
    case "rate":
      if(cur.step<t.steps.length-1){cur.step++;cur.phase="ask";cur.starter=false;rerenderBody();setFB("Good! 下一題。","good");if(hasTTS){var cc=cur;setTimeout(function(){if(cur===cc)speak(t.steps[cur.step].q)},300);}}
      else{cur.attempts=t.steps.length;complete();}
      break;
    case "copy":
      var box=document.getElementById("exportbox"),msg=document.getElementById("copymsg");
      var fallback=function(){box.focus();box.select();msg.textContent="已選取，請按「拷貝」。";};
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(box.value).then(function(){msg.textContent="已複製，貼到備忘錄保存。";},fallback);}else fallback();}catch(err){fallback();}
      break;
    case "import":
      var im=document.getElementById("importbox"),m2=document.getElementById("importmsg");
      try{var s=JSON.parse(im.value.trim());if(!s||s.v!==1||!s.tasks)throw 0;state=s;save();m2.textContent="已還原。";setTimeout(renderParent,600);}
      catch(err){m2.textContent="備份碼格式不對，請確認有完整貼上。";}
      break;
    case "reset":
      if(!resetArmed){resetArmed=true;el.textContent="確定要清除？再按一次";el.classList.add("main");}
      else{state=fresh();save();renderHome();}
      break;
  }
});
app.addEventListener("change",function(e){
  if(e.target&&e.target.id==="voicesel"){var uri=e.target.value;var v=(speechSynthesis.getVoices()||[]).filter(function(x){return x.voiceURI===uri})[0];if(v){voice=v;state.voiceURI=uri;save();renderParent();speak("Hello, Lemon. Listen carefully.");}}
});
app.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&cur&&(cur.t.type==="fields"||cur.t.type==="passage")){e.preventDefault();check();}
});

(function migrate(){if(state.migr2)return;Object.keys(state.tasks).forEach(function(id){var r=state.tasks[id];if(r&&r.lastHints>=4)r.retry=true;});state.chapEndSeen=state.chapEndSeen||{};CHAPTERS.forEach(function(c,i){if(chapDone(i))state.chapEndSeen[c.id]=1;});state.migr2=1;save();})();
if(/test/.test(location.hash))window.__LI={st:function(){return state},cur:function(){return cur},sp:function(){return spS},READS:READS};
if(!state.introSeen)renderIntro(0);else renderHome();
})();
</script>
