<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>學校單字小考練習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 冒險島的延伸教室，溫柔、閃亮、給 8 歲愛漂亮的女孩
   IDEA: 魔法拼字本——每拼對一個字，書頁亮一顆星
   PICTURE: 題目卡（老師的圖＋中文）是畫面主角
   COLOUR/TYPE: 冒險島同款：奶油底、粉紅主色、薰衣草輔色、金色點綴；Baloo 2＋Noto Sans TC
   LAYOUT: iPad 直式為主，輸入框大、按鈕 52px 以上 */
:root{--sky:#d6eaff;--cream:#fffaf2;--ink:#3a3366;--pink:#ff8dbd;--pinkd:#d9548f;--lav:#a894ef;--lavl:#ece6ff;--mint:#7fd3b6;--gold:#ffc23d;--line:#e4daf7;--bad:#d94a70;--good:#24906c}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:linear-gradient(180deg,#ffe3f1 0%,#ece6ff 55%,#d6eaff 100%) fixed;color:var(--ink);font:17px/1.55 "Baloo 2","Noto Sans TC","PingFang TC",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:860px;margin:0 auto;padding:16px}
.screen{display:none}.screen.on{display:block}
h1{font:800 clamp(30px,5.5vw,44px)/1.1 "Noto Sans TC";margin:6px 0 4px;text-wrap:balance}
h1 span{color:var(--pinkd)}
h2{font:800 24px/1.2 "Noto Sans TC";margin:0 0 10px}
.muted{opacity:.75}
.card{background:var(--cream);border-radius:28px;padding:18px 20px;box-shadow:0 6px 0 var(--line);margin-top:16px}
button,select,input{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:999px;font-weight:800;font-size:18px;background:#fff;color:#a257a2;border:3px solid #f1d2f0;box-shadow:0 4px 0 #e5c3ea;cursor:pointer}
.btn.main{background:var(--pink);color:#fff;border-color:var(--pinkd);box-shadow:0 4px 0 var(--pinkd)}
.btn.lav{background:var(--lav);color:#fff;border-color:#8a75de;box-shadow:0 4px 0 #7d68d6}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.45}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{background:#fff;border-radius:999px;padding:4px 14px;font-weight:800;white-space:nowrap;box-shadow:0 3px 0 var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
select{border:3px solid var(--line);border-radius:14px;padding:6px 10px;min-height:48px;background:#fff;font-weight:800}
.big3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:14px}
.mode{background:#fff;border:3px solid var(--line);border-radius:24px;padding:16px;text-align:left;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:4px}
.mode b{font:800 22px "Noto Sans TC"}.mode .k{font-size:15px;opacity:.75}
.mode .bar{height:8px;border-radius:4px;margin-bottom:6px}
.weak{display:flex;flex-wrap:wrap;gap:8px}
.weak span{background:#fff;border-radius:12px;padding:2px 10px;font-weight:800}
.weak small{color:var(--bad)}
.prog{display:flex;gap:5px;margin:10px 0}
.prog i{flex:1;height:10px;border-radius:5px;background:#fff}
.prog i.ok{background:var(--mint)}.prog i.hint{background:var(--gold)}.prog i.bad{background:var(--bad)}.prog i.now{background:var(--lav)}
.q{background:#fff;border-radius:28px;padding:16px;box-shadow:0 6px 0 var(--line)}
.pic{height:min(30vh,230px);display:grid;place-items:center}
.pic img{max-width:100%;max-height:100%;object-fit:contain}
.zh{font:800 26px/1.3 "Noto Sans TC";text-align:center;margin:8px 0 2px}
.def{text-align:center;font-size:16px;opacity:.8;margin:0}
.pattern{text-align:center;font:800 32px "Baloo 2";letter-spacing:6px;color:var(--pinkd);min-height:44px;margin:6px 0}
.ans{display:flex;gap:10px;margin-top:10px}
.ans input{flex:1;font:800 30px "Baloo 2";border:4px solid var(--line);border-radius:18px;padding:6px 16px;min-height:64px;background:#fff}
.ans input.bad{border-color:var(--bad);animation:shake .4s}.ans input.ok{border-color:var(--good)}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{text-align:center;font-weight:800;min-height:30px;margin:8px 0 0}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--good)}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.list{display:grid;gap:8px;margin-top:10px}
.li{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:8px 12px}
.li img{width:64px;height:48px;object-fit:contain}
.li b{font:800 22px "Baloo 2";display:block;line-height:1.1}
.li .s{font-size:15px}
.li button{min-height:48px;width:48px;border-radius:50%;border:0;background:var(--lavl);cursor:pointer;font-size:20px}
.res{text-align:center}
.res .st{font-size:56px;color:var(--gold);letter-spacing:6px}
.res .st .off{color:#fff}
.note{background:#fff3cd;border-radius:14px;padding:8px 12px;font-size:15px}
@media(max-width:600px){.ans{flex-direction:column}.ans .btn{width:100%}.li{grid-template-columns:52px 1fr auto}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="screen on">
  <div class="top"><a class="btn" href="../">← 回冒險島</a><span class="chip" id="en0"></span></div>
  <h1>學校單字<span>小考練習</span></h1>
  <p class="muted" style="margin:0">老師 Quizlet 的 Week 9–20 單字。看圖、聽發音，把整個字拼出來。</p>
  <div class="card">
    <div class="row"><b style="font-size:20px">本週小考</b><select id="qwk" aria-label="本週小考週次"></select><span class="muted" style="font-size:14px">每週由爸媽改・期末考範圍 Week 9–20</span></div>
    <div class="big3">
      <button class="mode" id="mQuiz"><span class="bar" style="background:var(--pink)"></span><b>小考特訓</b><span class="k" id="qk"></span></button>
      <button class="mode" id="mFinal"><span class="bar" style="background:var(--lav)"></span><b>期末總複習</b><span class="k">Week 9–20 混合 10 個字，常錯的先出</span></button>
      <button class="mode" id="mCards"><span class="bar" style="background:var(--mint)"></span><b>單字卡</b><span class="k">先看一遍、聽一遍再拼</span></button>
    </div>
  </div>
  <div class="card"><h2>最常拼錯的字</h2><div class="weak" id="weak"></div></div>
  <p class="muted" style="font-size:14px;margin-top:14px">完成一次特訓或總複習可得 ⚡魔法能量（同一天最多 ⚡6），會直接加進冒險島。</p>
</section>

<section id="cards" class="screen">
  <div class="top"><button class="btn" data-home>← 返回</button><select id="cwk" aria-label="選週次"></select></div>
  <div class="list" id="clist"></div>
</section>

<section id="play" class="screen">
  <div class="top"><button class="btn" data-home>← 離開</button><span class="chip" id="pname"></span></div>
  <div class="prog" id="prog"></div>
  <div class="q">
    <div class="pic" id="pic"></div>
    <div class="zh" id="qzh"></div>
    <p class="def" id="qdef"></p>
    <div class="pattern" id="pat"></div>
    <form class="ans" id="form" autocomplete="off"><input id="inp" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="拼出這個英文字"><button class="btn main" type="submit">檢查</button></form>
    <div class="msg" id="msg"></div>
    <div class="tools"><button class="btn" id="bSay">🔊 再聽一次</button><button class="btn" id="bHint">💡 提示</button><button class="btn" id="bDef">英文解釋</button></div>
  </div>
</section>

<section id="done" class="screen">
  <div class="card res">
    <h1 id="dT"></h1>
    <div class="st" id="dSt"></div>
    <p id="dMsg" style="font-weight:800"></p>
    <div class="list" id="dList" style="text-align:left"></div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn main" id="again">再練一次</button><button class="btn" data-home>回首頁</button></div>
  </div>
</section>

</div>

const words=wk=>DATA[wk].map(([en,zh,img,def,show,alt])=>({en,zh,img,def,show,alt,wk}));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const say=t=>{try{const sp=speechSynthesis;sp.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;const v=sp.getVoices().find(v=>/en[-_]US/.test(v.lang)&&/Samantha|Google|Aaron|Nicky/.test(v.name))||sp.getVoices().find(v=>/en[-_]US/.test(v.lang));if(v)u.voice=v;sp.speak(u)}catch(e){}};
const imgTag=w=>w.img?`<img src="${w.img.startsWith('http')?esc(w.img):IMG+esc(w.img)}" alt="" onerror="this.remove()">`:'';
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/é/g,'e').replace(/\s+/g,' ').trim();
const accepts=w=>[w.en,...w.alt].map(norm);

function island(){try{return JSON.parse(localStorage.getItem(ISLAND)||'null')}catch(e){return null}}
function addEnergy(n){
  const st=island();
  if(st&&st.v===1){st.energy=(st.energy||0)+n+(S.pend||0);S.pend=0;try{localStorage.setItem(ISLAND,JSON.stringify(st))}catch(e){S.pend=(S.pend||0)+n}}
  else S.pend=(S.pend||0)+n;
  save();
}
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0);if(id==='home')home()}
document.addEventListener('click',e=>{if(e.target.closest('[data-home]')){try{speechSynthesis.cancel()}catch(x){}go('home')}});

const opts=WEEKS.map(w=>`<option value="${w}">Week ${w}</option>`).join('');
$('qwk').innerHTML=opts;$('cwk').innerHTML=opts;
$('qwk').onchange=e=>{S.qwk=+e.target.value;save();home()};
function home(){
  const st=island();$('en0').textContent='⚡ 魔法能量 '+((st&&st.energy)||0);
  $('qwk').value=S.qwk;$('qk').textContent=`Week ${S.qwk} 的字，10 個，常錯的先出`;
  const all=WEEKS.flatMap(words),seen=new Set();
  const wk=all.filter(w=>!seen.has(w.en)&&seen.add(w.en)&&(S.wr[w.en]||0)>0).sort((a,b)=>(S.wr[b.en]-(S.wc[b.en]||0))-(S.wr[a.en]-(S.wc[a.en]||0))).slice(0,12);
  $('weak').innerHTML=wk.length?wk.map(w=>`<span>${esc(w.en)} <small>✗${S.wr[w.en]}</small></span>`).join(''):'<span class="muted" style="background:none">還沒有，開始練習吧！</span>';
}

function cards(wk){
  $('cwk').value=wk;
  $('clist').innerHTML=words(wk).map((w,i)=>`<div class="li">${imgTag(w)||'<span></span>'}<div><b>${esc(w.show||w.en)}</b><span class="s">${esc(w.zh)}</span><div class="s muted">${esc(w.def)}</div></div><button data-say="${i}" aria-label="念出來">🔊</button></div>`).join('');
  $('clist').onclick=e=>{const b=e.target.closest('[data-say]');if(b)say(words(wk)[+b.dataset.say].en)};
}
$('mCards').onclick=()=>{go('cards');cards(S.qwk)};
$('cwk').onchange=e=>cards(+e.target.value);

let G=null;
const weakScore=w=>(S.wr[w.en]||0)*2-(S.wc[w.en]||0)+Math.random()*1.5;
function start(kind){
  const src=kind==='quiz'?words(S.qwk):WEEKS.flatMap(words);const seen=new Set();
  const pool=src.filter(w=>!seen.has(w.en)&&seen.add(w.en));
  G={kind,q:pool.sort((a,b)=>weakScore(b)-weakScore(a)).slice(0,10),i:0,res:[]};
  $('pname').textContent=kind==='quiz'?`小考特訓 Week ${S.qwk}`:'期末總複習';
  go('play');ask();
}
$('mQuiz').onclick=()=>start('quiz');$('mFinal').onclick=()=>start('final');
$('again').onclick=()=>start(G.kind);
function prog(){$('prog').innerHTML=G.q.map((_,k)=>`<i class="${['bad','ok','hint'][G.res[k]]||(k===G.i?'now':'')}"></i>`).join('')}
function ask(){
  const w=G.q[G.i];G.wrong=0;G.hint=0;G.reveal=false;prog();
  $('pic').innerHTML=imgTag(w);$('qzh').textContent=w.zh;$('qdef').textContent='';$('pat').textContent='';
  $('msg').textContent='';$('msg').className='msg';$('inp').value='';$('inp').className='';$('bHint').disabled=false;
  setTimeout(()=>{say(w.en);$('inp').focus()},250);
}
function pattern(w,level){
  const t=w.en;let letters=[...t].map((c,i)=>/[a-z]/i.test(c)?i:-1).filter(i=>i>=0);
  let show=new Set([letters[0]]);
  if(level>1){const n=Math.ceil(letters.length*.5);shuf(letters.slice(1)).slice(0,n-1).forEach(i=>show.add(i))}
  return [...t].map((c,i)=>c===' '?' ':show.has(i)||!/[a-z]/i.test(c)?c:'_').join(' ');
}
$('bSay').onclick=()=>say(G.q[G.i].en);
$('bDef').onclick=()=>{const w=G.q[G.i];$('qdef').textContent=w.def||'（老師沒有寫解釋）'};
$('bHint').onclick=()=>{const w=G.q[G.i];if(G.hint>=2)return;G.hint++;$('pat').textContent=pattern(w,G.hint);if(G.hint>=2)$('bHint').disabled=true;say(w.en)};
$('form').onsubmit=e=>{
  e.preventDefault();const w=G.q[G.i],v=$('inp').value;
  if(!v.trim())return;
  if(/[^\x00-\x7F’‘é]/.test(v)){$('msg').className='msg bad';$('msg').textContent='好像是中文或注音鍵盤，請切換成英文鍵盤喔！';return}
  const ok=accepts(w).includes(norm(v));
  if(G.reveal){if(ok){next()}else{$('inp').className='bad';void $('inp').offsetWidth;$('inp').className='bad'}return}
  if(ok){
    $('inp').className='ok';$('msg').className='msg ok';
    $('msg').textContent=(G.wrong||G.hint?'答對了！':'太棒了，一次就拼對！')+(w.show?`（${w.show}）`:'');
    G.res[G.i]=G.wrong||G.hint?2:1;
    if(G.wrong||G.hint)S.wr[w.en]=(S.wr[w.en]||0)+1;else S.wc[w.en]=(S.wc[w.en]||0)+1;save();
    say(w.en);setTimeout(next,1400);
  }else{
    G.wrong++;$('inp').className='';void $('inp').offsetWidth;$('inp').className='bad';$('msg').className='msg bad';
    if(G.wrong>=3){G.reveal=true;G.res[G.i]=0;S.wr[w.en]=(S.wr[w.en]||0)+2;save();
      $('pat').textContent=w.en;$('msg').textContent='答案在上面，看著它打一次再繼續';$('inp').value='';$('bHint').disabled=true;say(w.en)}
    else{$('msg').textContent=G.wrong===1?'差一點，再聽一次試試看':'再試一次，也可以按「提示」';say(w.en)}
  }
};
function next(){G.i++;if(G.i>=G.q.length)finish();else ask()}
function finish(){
  const clean=G.res.filter(r=>r===1).length,okAll=G.res.filter(r=>r>=1).length,n=G.q.length;
  const st=clean>=n-2?3:okAll>=Math.ceil(n*.6)?2:1;
  const day=today();S.en[day]=S.en[day]||0;
  const first=!S.en[day+G.kind];const want=first?st:1;const gain=Math.max(0,Math.min(want,6-S.en[day]));
  S.en[day]+=gain;S.en[day+G.kind]=1;for(const k in S.en){if(!k.startsWith(day))delete S.en[k]}
  if(gain)addEnergy(gain);save();
  go('done');
  $('dT').textContent=st===3?'拼字小魔女！':st===2?'很不錯喔！':'練習完成！';
  $('dSt').innerHTML='★'.repeat(st)+`<span class="off">${'★'.repeat(3-st)}</span>`;
  $('dMsg').textContent=`一次拼對 ${clean} 個、全部答對 ${okAll} / ${n} 個`+(gain?`，得到 ⚡${gain}！`:'（今天的能量已經拿滿囉）');
  $('dList').innerHTML=G.q.map((w,k)=>`<div class="li">${imgTag(w)||'<span></span>'}<div><b>${esc(w.en)}</b><span class="s">${esc(w.zh)}</span></div><span style="font-size:24px;font-weight:800;color:${G.res[k]===1?'var(--good)':G.res[k]===2?'#c88a00':'var(--bad)'}">${G.res[k]===1?'✓':G.res[k]===2?'✓提示':'✗'}</span></div>`).join('');
}
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
if(location.hash==='#test')window.__SC={G:()=>G,S:()=>S};
home();
}
</script>
</body>
</html>
